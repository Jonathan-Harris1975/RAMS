[project]
name = "repo-management-suite"
version = "1.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "boto3>=1.34",
    "httpx>=0.27",
    "gitpython>=3.1",
    "typer>=0.12",
    "pathspec>=0.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "anyio>=4",
    "httpx>=0.27",
    "ruff>=0.5",
    # Keep CI on the type-checker major this repository is governed against.
    "mypy>=1.10,<2",
]

[project.scripts]
rms = "repo_mgmt.cli:app"
rms-api = "repo_mgmt.api:serve"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["repo_mgmt*"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider -p no:ddtrace"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Make the lint contract explicit so upstream default-rule changes cannot
# silently redefine the repository's CI gate.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
