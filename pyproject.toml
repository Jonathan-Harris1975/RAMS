[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jh-ops-chat-backend"
version = "0.1.0"
description = "Standalone Python OpenRouter ops chatbot backend"
requires-python = ">=3.11,<3.15"
dynamic = ["dependencies"]

[project.scripts]
rms-api = "repo_mgmt.api:serve"

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "ruff==0.15.20",
  "mypy==2.3.1",
  "pip-audit==2.10.1",
  "bandit==1.9.4",
  "pip-tools==7.6.1",
  "setuptools==84.0.0"
]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.in"]}

[tool.setuptools.packages.find]
include = ["repo_mgmt*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true
