[project]
name = "repo-management-suite"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "boto3>=1.34",
    "httpx>=0.27",
    "gitpython>=3.1",
    "apscheduler>=3.10",
    "typer>=0.12",
    "pathspec>=0.12",
    "python-dotenv>=1.0",
]

[project.scripts]
rms = "repo_mgmt.cli:app"
rms-api = "repo_mgmt.api:serve"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
where = ["."]
include = ["repo_mgmt*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
