[project]
name = "repository-automation-management-service"
version = "1.1.0"
description = "Repository Automation Management Service (RAMS)"
requires-python = ">=3.11,<3.15"
dependencies = [
  "boto3==1.43.18",
  "botocore==1.43.18",
  "fastapi==0.141.1",
  "headroom-ai==0.37.0",
  "httpx==0.28.1",
  "pathspec==1.1.1",
  "pydantic==2.13.5",
  "pydantic-settings==2.14.2",
  "starlette==1.6.0",
  "typer==0.27.1",
  "uvicorn[standard]==0.52.4"
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1,<10",
  "pytest-asyncio>=1.4.0,<2",
  "pytest-cov>=7.1.0,<8",
  "ruff>=0.15.20,<1",
  "mypy==2.3.1",
  "pip-audit>=2.10.1,<3",
  "bandit>=1.9.4,<2",
  "pip-tools>=7.6.1,<8"
]

[project.scripts]
rms = "repo_mgmt.cli:app"
rms-api = "repo_mgmt.api:serve"

[tool.setuptools.packages.find]
include = ["repo_mgmt*"]
exclude = ["config*", "scripts*", "tests*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
