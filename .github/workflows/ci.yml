name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pytest pytest-asyncio httpx

      - name: Run tests
        env:
          # Minimal env so Settings() validation passes in tests
          R2_ENDPOINT: "https://test.r2.cloudflarestorage.com"
          R2_ACCESS_KEY_ID: "test-key"
          R2_SECRET_ACCESS_KEY: "test-secret"
          OPENROUTER_API_KEY: "test-or-key"
          OPENROUTER_PRIMARY_MODEL: "anthropic/claude-3-5-sonnet"
          OPENROUTER_SECONDARY_MODEL: "anthropic/claude-3-haiku"
          OPENROUTER_TRIAGE_MODEL: "openai/gpt-4o-mini"
          RMS_SEO_REPO_PATH: "/tmp/fake-seo"
          RMS_WEBSITE_REPO_PATH: "/tmp/fake-website"
          RMS_DRY_RUN: "true"
        run: pytest tests/ -v --tb=short

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install linters
        run: pip install ruff mypy
      - name: Ruff check
        run: ruff check repo_mgmt/ tests/ || true
      - name: Mypy
        run: mypy repo_mgmt/ || true

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build --target runtime -t rms:ci .
