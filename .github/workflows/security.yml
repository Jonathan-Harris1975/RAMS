name: Security and repository quality
'on':
  pull_request: null
  push:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: rams-security-${{ github.ref }}
  cancel-in-progress: true
env:
  SCORECARD_VERSION: 5.5.0
jobs:
  dependency_review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
    - name: Block vulnerable dependency changes without choosing versions
      uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
      with:
        fail-on-severity: high
        fail-on-scopes: runtime,development,unknown
        vulnerability-check: true
        license-check: false
        warn-only: false
        comment-summary-in-pr: never
        retry-on-snapshot-warnings: true
        retry-on-snapshot-warnings-timeout: 120
  repository_security:
    name: Trivy, Gitleaks and actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - name: Observe runner processes and egress
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
      with:
        egress-policy: audit
    - name: Checkout repository with full history
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Install pinned zizmor
      run: python3 scripts/install_ci_tools.py zizmor
    - name: Prove Council completion authentication and stale-evidence rejection
      run: python3 .github/scripts/test_council_receipt.py
    - name: Inspect GitHub Actions security posture
      run: .ci-tools/bin/zizmor --offline .github/workflows
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 24.21.0
    - name: Strict Renovate configuration validation
      run: npx --yes --package renovate@44.132.5 -- renovate-config-validator --strict renovate.json
    - name: Verify automation ownership boundaries
      run: python3 .github/scripts/test_ci_ownership.py
    - name: Verify fixed weekend windows and DST guards
      run: python3 .github/scripts/test_weekend_slot.py
    - name: Verify branch PR safety and idempotency
      run: python3 .github/scripts/test_branch_pr_automation.py
    - name: Verify autonomy lifecycle regressions
      run: python3 .github/scripts/test_autonomy_lifecycle.py
    - name: Verify PR blocker recovery regressions
      id: blocker_recovery_tests
      continue-on-error: true
      run: python3 .github/scripts/test_pr_blocker_recovery.py
    - name: Prepare isolated diagnostic paths
      run: mkdir -p "$RUNNER_TEMP/security-raw" "$RUNNER_TEMP/security-diagnostics"
    - name: Test diagnostic redaction and failure handling
      id: security_tests
      run: python3 .github/scripts/test_security_diagnostics.py
    - name: Install pinned CI tools
      run: python scripts/install_ci_tools.py trivy gitleaks actionlint
      id: install_security_tools
    - name: Trivy filesystem vulnerability and misconfiguration scan
      run: .ci-tools/bin/trivy fs . --scanners vuln,misconfig --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress --format json --output "$RUNNER_TEMP/security-raw/trivy.json"
      id: trivy
      continue-on-error: true
      if: ${{ !cancelled() && steps.install_security_tools.outcome == 'success' }}
    - name: Verify Gitleaks detector is functional
      shell: bash
      run: |
        set -euo pipefail
        canary="ghp_$(printf 'rams-gitleaks-canary' | sha256sum | cut -c1-36)"
        set +e
        printf 'token = "%s"\n' "$canary" | .ci-tools/bin/gitleaks stdin --redact --no-banner --exit-code 42 >/dev/null 2>&1
        status=$?
        set -e
        if [ "$status" -ne 42 ]; then
          echo "Gitleaks self-test failed: expected the synthetic canary to be detected (exit 42), got exit $status." >&2
          exit 1
        fi
    - name: Gitleaks full-history secret scan
      id: gitleaks
      shell: bash
      run: |
        set -uo pipefail
        set +e
        .ci-tools/bin/gitleaks git . --gitleaks-ignore-path .gitleaksignore --redact=100 --no-banner --report-format json --report-path "$RUNNER_TEMP/security-raw/gitleaks.json" --exit-code 42
        status=$?
        if [ "$status" -eq 42 ]; then
          echo '::error::Potential secrets detected. See the Security findings and deployment blockers summary and security-diagnostics artifact.'
        elif [ "$status" -ne 0 ]; then
          echo "::error::Gitleaks execution failed (exit $status); this is an operational error, not a finding count. Inspect this step."
        fi
        exit "$status"
      continue-on-error: true
      if: ${{ !cancelled() && steps.install_security_tools.outcome == 'success' }}
    - name: Validate GitHub Actions workflows
      run: |
        set +e
        .ci-tools/bin/actionlint  -format '{{json .}}' > "$RUNNER_TEMP/security-raw/actionlint.json"
        status=$?
        if [ "$status" -eq 0 ]; then printf "[]\n" > "$RUNNER_TEMP/security-raw/actionlint.json"; fi
        exit "$status"
      id: actionlint
      continue-on-error: true
      if: ${{ !cancelled() && steps.install_security_tools.outcome == 'success' }}
    - name: Publish actionable security findings
      if: always()
      env:
        SECURITY_STEPS: ${{ toJSON(steps) }}
        RAW_REPORT_DIR: ${{ runner.temp }}/security-raw
        REPORT_DIR: ${{ runner.temp }}/security-diagnostics
      run: python3 .github/scripts/security_diagnostics.py
    - name: Upload metadata-only diagnostic reports
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: security-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/security-diagnostics/
        retention-days: 30
        if-no-files-found: error
    - name: Enforce all scanner results
      if: always()
      env:
        SECURITY_STEPS: ${{ toJSON(steps) }}
      run: |-
        python3 - <<'PYCODE'
        import json
        import os
        steps = json.loads(os.environ['SECURITY_STEPS'])
        failed = [name for name, step in steps.items() if step.get('outcome') in ('failure', 'cancelled')]
        if failed:
            print('::error::Security check blocked by: ' + ', '.join(failed) + '. Open the job summary and diagnostic artifact for details.')
            raise SystemExit(1)
        for name in ('gitleaks', 'trivy', 'actionlint'):
            if steps.get(name, {}).get('outcome') != 'success':
                print('::error::Required scanner did not complete successfully: ' + name)
                raise SystemExit(1)
        PYCODE
  container_and_shell_quality:
    name: Hadolint and ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Install pinned Docker and shell linters
      run: python scripts/install_ci_tools.py hadolint shellcheck
    - name: Lint Dockerfile
      run: .ci-tools/bin/hadolint Dockerfile
    - name: Lint operational shell scripts
      run: .ci-tools/bin/shellcheck scripts/install_production.sh scripts/release_gate.sh scripts/smoke_test.sh
  link_integrity:
    name: Lychee link integrity
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Install pinned Lychee
      continue-on-error: true
      run: python scripts/install_ci_tools.py lychee
    - name: Check repository links
      continue-on-error: true
      run: .ci-tools/bin/lychee --no-progress --cache --max-retries 2 --timeout 20 README.md SECURITY.md CONTEXT_RESILIENCE.md docs
  scorecard:
    name: OpenSSF Scorecard
    continue-on-error: true
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
    - name: Install pinned Scorecard CLI from source
      continue-on-error: true
      env:
        GOBIN: ${{ runner.temp }}/scorecard-bin
      run: |
        set -euo pipefail
        mkdir -p "$GOBIN"
        go install "github.com/ossf/scorecard/v5@v${SCORECARD_VERSION}"
        "$GOBIN/scorecard" version
    - name: Run OpenSSF Scorecard
      continue-on-error: true
      env:
        GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SCORECARD_BIN: ${{ runner.temp }}/scorecard-bin/scorecard
      run: |
        set -euo pipefail
        "$SCORECARD_BIN" --repo="github.com/${GITHUB_REPOSITORY}" --format=json --show-details > scorecard.json
        cat scorecard.json
