name: Security and repository quality

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rams-security-${{ github.ref }}
  cancel-in-progress: true

env:
  SCORECARD_VERSION: '5.5.0'

jobs:
  repository_security:
    name: Trivy, Gitleaks and actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify autonomy lifecycle regressions
        run: python3 .github/scripts/test_autonomy_lifecycle.py
      - name: Install pinned CI tools
        run: python scripts/install_ci_tools.py trivy gitleaks actionlint
      - name: Trivy filesystem vulnerability and misconfiguration scan
        run: >-
          .ci-tools/bin/trivy fs .
          --scanners vuln,misconfig
          --severity HIGH,CRITICAL
          --ignore-unfixed
          --exit-code 1
          --no-progress
      - name: Verify Gitleaks detector is functional
        shell: bash
        run: |
          set -euo pipefail
          canary="ghp_$(printf 'rams-gitleaks-canary' | sha256sum | cut -c1-36)"
          set +e
          printf 'token = "%s"\n' "$canary" | .ci-tools/bin/gitleaks stdin --redact --no-banner --exit-code 42 >/dev/null 2>&1
          status=$?
          set -e
          if [ "$status" -ne 42 ]; then
            echo "Gitleaks self-test failed: expected the synthetic canary to be detected (exit 42), got exit $status." >&2
            exit 1
          fi
      - name: Gitleaks full-history secret scan
        id: gitleaks
        shell: bash
        run: |
          set -euo pipefail
          # Keep "secret found" distinct from an operational scanner failure.
          # Gitleaks otherwise uses exit 1 for findings, which makes an empty
          # report needlessly ambiguous when CI itself has failed.
          set +e
          .ci-tools/bin/gitleaks git . \
            --redact \
            --no-banner \
            --report-format json \
            --report-path gitleaks-report.json \
            --exit-code 42 2>&1 | tee gitleaks-scan.log
          status=${PIPESTATUS[0]}
          set -e

          # Always leave a valid redacted report behind for the diagnostic
          # artifact, including the clean-repository case.
          if [ ! -s gitleaks-report.json ]; then
            printf '[]\n' > gitleaks-report.json
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("gitleaks-report.json").read_text(encoding="utf-8"))
          if not isinstance(report, list):
              raise SystemExit("Gitleaks JSON report is not a list")
          PY

          case "$status" in
            0)
              echo 'Gitleaks completed: no unignored secrets detected.'
              ;;
            42)
              echo 'Gitleaks detected potential secrets. See the redacted diagnostic artifact.' >&2
              exit 42
              ;;
            *)
              echo "Gitleaks scanner failed operationally with exit $status; this is not being misreported as a secret finding." >&2
              exit "$status"
              ;;
          esac
      - name: Upload redacted Gitleaks diagnostic report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-redacted-diagnostic-${{ github.run_id }}
          path: |
            gitleaks-report.json
            gitleaks-scan.log
          if-no-files-found: warn
          retention-days: 14
      - name: Validate GitHub Actions workflows
        run: .ci-tools/bin/actionlint -color

  container_and_shell_quality:
    name: Hadolint and ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Docker and shell linters
        run: python scripts/install_ci_tools.py hadolint shellcheck
      - name: Lint Dockerfile
        run: .ci-tools/bin/hadolint Dockerfile
      - name: Lint operational shell scripts
        run: .ci-tools/bin/shellcheck scripts/install_production.sh scripts/release_gate.sh scripts/smoke_test.sh

  link_integrity:
    name: Lychee link integrity
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Lychee
        continue-on-error: true
        run: python scripts/install_ci_tools.py lychee
      - name: Check repository links
        continue-on-error: true
        run: >-
          .ci-tools/bin/lychee
          --no-progress
          --cache
          --max-retries 2
          --timeout 20
          README.md SECURITY.md CONTEXT_RESILIENCE.md docs

  scorecard:
    name: OpenSSF Scorecard
    continue-on-error: true
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - name: Install pinned Scorecard CLI from source
        continue-on-error: true
        env:
          GOBIN: ${{ runner.temp }}/scorecard-bin
        run: |
          set -euo pipefail
          mkdir -p "$GOBIN"
          go install "github.com/ossf/scorecard/v5@v${SCORECARD_VERSION}"
          "$GOBIN/scorecard" version
      - name: Run OpenSSF Scorecard
        continue-on-error: true
        env:
          GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCORECARD_BIN: ${{ runner.temp }}/scorecard-bin/scorecard
        run: |
          set -euo pipefail
          "$SCORECARD_BIN" --repo="github.com/${GITHUB_REPOSITORY}" --format=json --show-details > scorecard.json
          cat scorecard.json
