name: Renovate dependency lock sync

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  sync-locks:
    name: Regenerate hashed dependency locks
    if: ${{ github.event.pull_request.user.login == 'renovate[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the Renovate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
          cache: "pip"

      - name: Install locked dependency tooling
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-bootstrap.txt
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.txt

      - name: Regenerate all hashed locks
        run: python scripts/regenerate_dependency_locks.py

      - name: Commit lock changes when required
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- requirements-runtime.lock requirements-bootstrap.txt requirements-build.txt requirements-dev.txt; then
            echo "Dependency locks already match their source manifests."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements-runtime.lock requirements-bootstrap.txt requirements-build.txt requirements-dev.txt
          git commit -m "deps: regenerate hashed dependency locks"
          git push origin "HEAD:${HEAD_REF}"
