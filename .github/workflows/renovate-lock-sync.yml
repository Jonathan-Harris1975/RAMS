name: Renovate dependency lock sync

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] trusted Renovate-only metadata sync; PR code is not executed
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  sync-locks:
    name: Regenerate hashed dependency locks
    if: ${{ github.event.pull_request.user.login == 'renovate[bot]' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Mint autonomous repair GitHub App token
        id: app_token
        env:
          APP_ID: ${{ vars.AUTONOMY_REPAIR_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.AUTONOMY_REPAIR_APP_PRIVATE_KEY }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${APP_ID:-}" || { echo "::error::Repository variable AUTONOMY_REPAIR_APP_ID is required."; exit 1; }
          test -n "${APP_PRIVATE_KEY:-}" || { echo "::error::Repository secret AUTONOMY_REPAIR_APP_PRIVATE_KEY is required."; exit 1; }
          key_file="${RUNNER_TEMP}/autonomy-repair-app.pem"
          printf '%s\n' "$APP_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now="$(date +%s)"
          iat="$((now - 60))"
          exp="$((now + 540))"
          header="$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | b64url)"
          payload="$(printf '{"iat":%s,"exp":%s,"iss":"%s"}' "$iat" "$exp" "$APP_ID" | b64url)"
          unsigned="${header}.${payload}"
          signature="$(printf '%s' "$unsigned" | openssl dgst -sha256 -sign "$key_file" -binary | b64url)"
          jwt="${unsigned}.${signature}"
          installation_id="$(curl --fail-with-body --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${jwt}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/installation" | jq -er '.id')"
          app_token="$(curl --fail-with-body --silent --show-error --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${jwt}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/app/installations/${installation_id}/access_tokens" | jq -er '.token')"
          rm -f "$key_file"
          echo "::add-mask::${app_token}"
          printf 'token=%s\n' "$app_token" >> "$GITHUB_OUTPUT"

      - name: Check out the Renovate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          token: ${{ steps.app_token.outputs.token }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"
          cache: "pip"

      - name: Install locked dependency tooling
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-bootstrap.txt
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-lock-tools.txt

      - name: Regenerate all hashed locks
        run: python scripts/regenerate_dependency_locks.py

      - name: Commit lock changes when required
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          if git diff --quiet -- requirements-runtime.lock requirements-bootstrap.txt requirements-build.txt requirements-dev.txt requirements-lock-tools.txt; then
            echo "Dependency locks already match their source manifests."
            exit 0
          fi
          git config user.name "autonomy-repair[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements-runtime.lock requirements-bootstrap.txt requirements-build.txt requirements-dev.txt requirements-lock-tools.txt
          git commit -m "deps: regenerate hashed dependency locks"
          git push origin "HEAD:${HEAD_REF}"
