name: DAST penetration test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dast-${{ github.repository }}
  cancel-in-progress: false

env:
  DAST_ENABLED: ${{ vars.DAST_ENABLED || 'false' }}
  DAST_TARGET_URL: ${{ vars.DAST_TARGET_URL || '' }}
  R2_ENDPOINT: ${{ vars.R2_ENDPOINT || 'https://3fb60a7136e950a7ec74959b45e4635e.r2.cloudflarestorage.com' }}
  EVIDENCE_BUCKET: hive-repositories

jobs:
  zap-full-scan:
    name: OWASP ZAP full active scan
    if: ${{ vars.DAST_ENABLED == 'true' && vars.DAST_TARGET_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 105
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Refuse unauthorised/non-HTTPS remote target
        shell: bash
        run: |
          set -euo pipefail
          case "$DAST_TARGET_URL" in https://*) ;; *) echo "::error::DAST_TARGET_URL must be an authorised HTTPS endpoint."; exit 1;; esac
      - name: Run authorised ZAP full scan
        uses: zaproxy/action-full-scan@3c58388149901b9a03b7718852c5ba889646c27c # v0.13.0
        with:
          target: ${{ env.DAST_TARGET_URL }}
          allow_issue_writing: false
          fail_action: true
          artifact_name: dast-zap-full-${{ github.run_id }}
      - name: Install pinned R2 client dependencies
        if: always()
        run: python -m pip install --require-hashes -r requirements-runtime.lock
      - name: Persist DAST evidence to hive-repositories
        if: always()
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TARGET_SHA: ${{ github.sha }}
          EVIDENCE_KIND: dast
          EVIDENCE_STATUS: ${{ job.status }}
          EVIDENCE_FILES: "report_json.json,report_md.md,report_html.html"
        run: python .github/scripts/persist_r2_evidence.py
