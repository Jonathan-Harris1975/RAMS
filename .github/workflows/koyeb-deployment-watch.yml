name: Koyeb production deployment watch

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] exact-main successful same-repository CI gate
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: koyeb-deployment-watch-RAMS
  cancel-in-progress: false

jobs:
  watch:
    environment: Koyeb
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve Koyeb service from Environment or repository
        env:
          KOYEB_SERVICE_REPOSITORY: ${{ vars.KOYEB_SERVICE || '' }}
          KOYEB_SERVICE_SECRET: ${{ secrets.KOYEB_SERVICE || '' }}
        shell: bash
        run: |
          set -euo pipefail
          service="${KOYEB_SERVICE:-${KOYEB_SERVICE_SECRET:-${KOYEB_SERVICE_REPOSITORY:-}}}"
          if [ -z "$service" ]; then
            echo "::error::KOYEB_SERVICE is required at the Koyeb Environment or repository scope."
            exit 1
          fi
          printf 'KOYEB_SERVICE=%s\n' "$service" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Check Koyeb deployment-watch configuration
        id: deployment_config
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
        run: |
          set -euo pipefail
          missing=()
          for name in KOYEB_TOKEN KOYEB_SERVICE; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::RAMS production deployment verification cannot run. Missing required configuration: %s\n' "${missing[*]}"
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
      - name: Install verified Koyeb CLI
        env:
          KOYEB_CLI_VERSION: "5.10.2"
        run: |
          set -euo pipefail
          archive="koyeb-cli_${KOYEB_CLI_VERSION}_linux_amd64.tar.gz"
          release_url="https://github.com/koyeb/koyeb-cli/releases/download/v${KOYEB_CLI_VERSION}"
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          curl --fail --show-error --silent --location --proto '=https' --tlsv1.2 \
            --output "$workdir/$archive" "$release_url/$archive"
          curl --fail --show-error --silent --location --proto '=https' --tlsv1.2 \
            --output "$workdir/checksums.txt" "$release_url/checksums.txt"
          (
            cd "$workdir"
            grep -F "  $archive" checksums.txt > archive.sha256
            test -s archive.sha256
            sha256sum --check --strict archive.sha256
            tar -xzf "$archive"
          )
          install -d -m 0755 "$HOME/.local/bin"
          install -m 0755 "$workdir/koyeb" "$HOME/.local/bin/koyeb"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Watch production deployment
        id: watch_deployment
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
          SERVICE_DISPLAY_NAME: RAMS
          OPS_ALERT_WEBHOOK_URL: ${{ secrets.OPS_ALERT_WEBHOOK_URL }}
          OPS_ALERT_WEBHOOK_TOKEN: ${{ secrets.OPS_ALERT_WEBHOOK_TOKEN }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          EXPECTED_DEPLOYMENT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          EXPECTED_DEPLOYMENT_AFTER: ${{ github.event.workflow_run.created_at || '' }}
          DEPLOYMENT_ATTESTATION_PATH: deployment-attestation.json
          DEPLOYMENT_ENVIRONMENT: production
        run: |
          set -o pipefail
          python scripts/watch_koyeb_deployment.py 2>&1 | tee deployment-watch.log
      - name: Record deployment-watch outcome
        if: ${{ always() }}
        env:
          EXPECTED_DEPLOYMENT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          CONFIG_OUTCOME: ${{ steps.deployment_config.outcome }}
          WATCH_OUTCOME: ${{ steps.watch_deployment.outcome }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          evidence = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "expected_sha": os.environ["EXPECTED_DEPLOYMENT_SHA"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "configuration_outcome": os.environ["CONFIG_OUTCOME"],
              "watch_outcome": os.environ["WATCH_OUTCOME"],
              "attestation_written": Path("deployment-attestation.json").is_file(),
          }
          Path("deployment-watch-outcome.json").write_text(
              json.dumps(evidence, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
      - name: Retain production deployment evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rams-deployment-evidence-${{ github.event.workflow_run.head_sha || github.sha }}
          path: |
            deployment-watch-outcome.json
            deployment-watch.log
            deployment-attestation.json
          if-no-files-found: warn
          retention-days: 90
