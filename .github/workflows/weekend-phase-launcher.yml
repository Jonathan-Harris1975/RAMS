name: Weekend CI phase launcher

on:
  schedule:
    - cron: "30 3 * * 6"
    - cron: "30 2 * * 6"
    - cron: "0 18 * * 6"
    - cron: "0 17 * * 6"
    - cron: "30 8 * * 0"
    - cron: "30 7 * * 0"
  workflow_dispatch:
    inputs:
      phase:
        description: "Phase to dispatch"
        required: true
        default: ci
        type: choice
        options:
          - ci
          - dast
          - council

permissions:
  actions: write
  contents: read

concurrency:
  group: weekend-phase-launcher-${{ github.repository }}
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve Europe/London phase slot
        id: slot
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PHASE: ${{ inputs.phase || '' }}
        shell: bash
        run: |
          set -euo pipefail
          now="$(TZ=Europe/London date '+%a %H:%M')"
          phase=""; workflow=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            phase="$MANUAL_PHASE"
            case "$phase" in
              ci) workflow="ci.yml" ;;
              dast) workflow="dast.yml" ;;
              council) workflow="council.yml" ;;
              *) echo "::error::Unsupported phase $phase"; exit 1 ;;
            esac
          else
          if [ "$now" = "Sat 03:30" ]; then phase="ci"; workflow="ci.yml"; fi
          if [ "$now" = "Sat 18:00" ]; then phase="dast"; workflow="dast.yml"; fi
          if [ "$now" = "Sun 08:30" ]; then phase="council"; workflow="council.yml"; fi
          fi
          if [ -z "$phase" ]; then
            echo "Scheduled UTC/DST duplicate is outside the intended London slot; no action."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "run=true"
            echo "phase=$phase"
            echo "workflow=$workflow"
          } >> "$GITHUB_OUTPUT"

      - name: Dispatch phase workflow
        if: steps.slot.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ steps.slot.outputs.workflow }}
        run: gh workflow run "$WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref "${{ github.event.repository.default_branch }}"

      - name: Record allocated windows
        if: always()
        run: |
          echo "CI: Sat 03:30–Sat 06:00"
          echo "DAST: Sat 18:00–Sat 20:00"
          echo "Council: Sun 08:30–Sun 11:00"
          echo "Weekend operating envelope: Friday 20:00 to Monday 04:00 Europe/London"
