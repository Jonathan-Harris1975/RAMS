version: "3.9"

services:
  rms-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: repo-management-suite:latest
    container_name: rms-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      # Optional local development mounts. In Koyeb, prefer RMS_REPO_BOOTSTRAP_ENABLED=true.
      - type: bind
        source: ${RMS_WEBSITE_REPO_PATH:-/tmp/rams-repos/website}
        target: /repos/website
        read_only: false
      - type: bind
        source: ${RMS_AIMS_REPO_PATH:-/tmp/rams-repos/aims}
        target: /repos/aims
        read_only: false
    environment:
      - RMS_WEBSITE_REPO_PATH=/repos/website
      - RMS_AIMS_REPO_PATH=/repos/aims
    healthcheck:
      test: ["CMD", "python", "-c",
             "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
